[project]
name = 'wasmjs'
version = '0.0.15.0.2'  # API 0, QuickJS-NG 0.15.0, code version 2.
description = "Simple wrapper around QuickJS-NG's qjs-wasi-reactor.wasm."
readme = 'README.md'
authors = [
    {name = 'Daniel Reed', email = 'nmlorg@gmail.com'},
]
requires-python = '>=3.10'  # https://github.com/pylint-dev/pylint/pull/10405
dependencies = [
    'qjs-wasi-reactor.wasm >= 0.15.0, < 0.15.1',
    'wasmtime',
]

[project.optional-dependencies]
dev = [
    'pylint',
    'pytest-cov',
    'pytest',
]

[project.scripts]
wasmjs = 'wasmjs.__main__:main'

[project.urls]
Homepage = 'https://github.com/nmlorg/wasmjs'
Issues = 'https://github.com/nmlorg/wasmjs/issues'

[tool.coverage.run]
omit = [
    '__main__.py',
]

[tool.pylint.main]
source-roots = ['.']

[tool.pylint.'MESSAGES CONTROL']
disable = [
    'consider-using-min-builtin',
    'consider-using-ternary',
    'no-member',
    'too-few-public-methods',
]

[tool.pytest.ini_options]
addopts = '-rN --cov=wasmjs --cov-report=html'
consider_namespace_packages = true
testpaths = ['wasmjs']
verbosity_assertions = 2

[tool.setuptools.packages.find]
include = ['wasmjs', 'wasmjs.*']

[tool.tox]
env_list = ['py310', 'py311', 'py312', 'py313', 'py314', 'py315']
skip_missing_interpreters = true

[tool.tox.env_run_base]
extras = ['dev']
deps = [
    'yapf',
]
commands = [
    ['yapf', '-i', '-r', 'examples', 'wasmjs'],
    ['python', '-B', '-m', 'pytest'],
    ['pylint', 'examples', 'wasmjs'],
]

[tool.yapf]
based_on_style = 'google'
column_limit = 100
